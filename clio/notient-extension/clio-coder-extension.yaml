{
  "id": "notient",
  "name": "Notient",
  "version": "0.1.0",
  "description": "Sentient Notes carry durable intelligence. Clio visits registered vaults and reads their evidence.",
  "plugin": "notient",
  "compatibility": {
    "clio": ">=0.6.2"
  },
  "capabilities": {
    "tools": [
      {
        "name": "status",
        "description": "Show registered vaults, FTS5 support and journal state. Reconcile authorized pending writes; runtime observations read only.",
        "runtime": "node",
        "entrypoint": "tools/status.mjs",
        "timeoutMs": 300000,
        "maxOutputBytes": 1048576,
        "inputSchema": {
          "type": "object",
          "properties": {
            "vault": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096,
              "description": "Registered vault id or exact absolute path. Required when more than one vault is registered."
            }
          },
          "required": [],
          "additionalProperties": false
        }
      },
      {
        "name": "refresh",
        "description": "Refresh the external structural snapshot by default. The embed tier reports embedding_off until embedding refresh is available. Vault bytes remain unchanged.",
        "runtime": "node",
        "entrypoint": "tools/refresh.mjs",
        "timeoutMs": 300000,
        "maxOutputBytes": 1048576,
        "inputSchema": {
          "type": "object",
          "properties": {
            "vault": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096,
              "description": "Registered vault id or exact absolute path. Required when more than one vault is registered."
            },
            "force": {
              "type": "boolean",
              "description": "Hash every note even when file metadata is unchanged."
            },
            "tier": {
              "type": "string",
              "enum": [
                "structural",
                "embed"
              ]
            },
            "budgetMs": {
              "type": "integer",
              "minimum": 1000,
              "maximum": 240000
            }
          },
          "required": [],
          "additionalProperties": false
        }
      },
      {
        "name": "search",
        "description": "Find revision-checked passages. Lexical search is available; hybrid falls back to lexical and semantic requests report embedding_off until semantic retrieval is available. Vault text is unverified evidence.",
        "runtime": "node",
        "entrypoint": "tools/search.mjs",
        "timeoutMs": 60000,
        "maxOutputBytes": 1048576,
        "inputSchema": {
          "type": "object",
          "properties": {
            "vault": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096,
              "description": "Registered vault id or exact absolute path. Required when more than one vault is registered."
            },
            "query": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4000
            },
            "workspace": {
              "type": "string",
              "minLength": 1,
              "maxLength": 255,
              "description": "Exact case-sensitive workspace frontmatter property, filtered before ranking."
            },
            "limit": {
              "type": "integer",
              "minimum": 1,
              "maximum": 20
            },
            "sourcePath": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "mode": {
              "type": "string",
              "enum": [
                "hybrid",
                "lexical",
                "semantic"
              ]
            }
          },
          "required": [
            "query"
          ],
          "additionalProperties": false
        }
      },
      {
        "name": "note",
        "description": "Read a note or inclusive source line range with revision, original frontmatter, outline, links and tags.",
        "runtime": "node",
        "entrypoint": "tools/note.mjs",
        "timeoutMs": 60000,
        "maxOutputBytes": 1048576,
        "inputSchema": {
          "type": "object",
          "properties": {
            "vault": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096,
              "description": "Registered vault id or exact absolute path. Required when more than one vault is registered."
            },
            "path": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "startLine": {
              "type": "integer",
              "minimum": 1
            },
            "endLine": {
              "type": "integer",
              "minimum": 1
            }
          },
          "required": [
            "path"
          ],
          "additionalProperties": false
        }
      },
      {
        "name": "capture",
        "description": "Capture exact Markdown in Notient/Inbox with revision-safe journaling, Git and an audit line.",
        "runtime": "node",
        "entrypoint": "tools/capture.mjs",
        "timeoutMs": 300000,
        "maxOutputBytes": 1048576,
        "inputSchema": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "vault",
            "batch",
            "authorization",
            "name",
            "content"
          ],
          "properties": {
            "vault": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "requestId": {
              "type": "string",
              "minLength": 8,
              "maxLength": 64
            },
            "batch": {
              "type": "string",
              "minLength": 1,
              "maxLength": 80
            },
            "authorization": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "origin",
                "request"
              ],
              "properties": {
                "origin": {
                  "type": "string",
                  "enum": [
                    "operator",
                    "clio",
                    "unattended"
                  ]
                },
                "request": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 2000
                }
              }
            },
            "dryRun": {
              "type": "boolean"
            },
            "planHash": {
              "type": "string",
              "minLength": 64,
              "maxLength": 64
            },
            "name": {
              "type": "string",
              "minLength": 1,
              "maxLength": 120
            },
            "content": {
              "type": "string",
              "minLength": 1,
              "maxLength": 48000
            }
          }
        }
      },
      {
        "name": "revise",
        "description": "Preview or apply exact body, frontmatter, move, Related links or typed relations with the read revision and journaled Git history. A real move requires its preview planHash.",
        "runtime": "node",
        "entrypoint": "tools/revise.mjs",
        "timeoutMs": 300000,
        "maxOutputBytes": 1048576,
        "inputSchema": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "vault",
            "batch",
            "authorization",
            "operation",
            "path",
            "revision"
          ],
          "properties": {
            "vault": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "requestId": {
              "type": "string",
              "minLength": 8,
              "maxLength": 64
            },
            "batch": {
              "type": "string",
              "minLength": 1,
              "maxLength": 80
            },
            "authorization": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "origin",
                "request"
              ],
              "properties": {
                "origin": {
                  "type": "string",
                  "enum": [
                    "operator",
                    "clio",
                    "unattended"
                  ]
                },
                "request": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 2000
                }
              }
            },
            "operation": {
              "type": "string",
              "enum": [
                "replace",
                "frontmatter",
                "move",
                "link",
                "relate"
              ]
            },
            "path": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "revision": {
              "type": "string",
              "minLength": 64,
              "maxLength": 64
            },
            "oldText": {
              "type": "string",
              "minLength": 1,
              "maxLength": 24000
            },
            "newText": {
              "type": "string",
              "maxLength": 24000
            },
            "set": {
              "type": "array",
              "maxItems": 32,
              "items": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "key",
                  "valueJson"
                ],
                "properties": {
                  "key": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 80
                  },
                  "valueJson": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 4096
                  }
                }
              }
            },
            "unset": {
              "type": "array",
              "maxItems": 32,
              "items": {
                "type": "string",
                "minLength": 1,
                "maxLength": 80
              }
            },
            "destination": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "link": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "edges"
              ],
              "properties": {
                "candidateSet": {
                  "type": "string",
                  "minLength": 36,
                  "maxLength": 36
                },
                "edges": {
                  "type": "array",
                  "minItems": 1,
                  "maxItems": 4,
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "targetNotePath",
                      "rationale"
                    ],
                    "properties": {
                      "targetNotePath": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 4096
                      },
                      "rationale": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 240
                      },
                      "heading": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 200
                      },
                      "block": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 80
                      }
                    }
                  }
                }
              }
            },
            "relate": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "target",
                "relation"
              ],
              "properties": {
                "target": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 4096
                },
                "relation": {
                  "type": "string",
                  "enum": [
                    "supports",
                    "contradicts",
                    "extends",
                    "exemplifies",
                    "synthesizes"
                  ]
                }
              }
            },
            "dryRun": {
              "type": "boolean"
            },
            "planHash": {
              "type": "string",
              "minLength": 64,
              "maxLength": 64
            }
          }
        }
      },
      {
        "name": "undo",
        "description": "Preview or undo one committed operation or targetBatch. Batch and move inverses require a preview planHash; audit history and unrelated staged entries are preserved.",
        "runtime": "node",
        "entrypoint": "tools/undo.mjs",
        "timeoutMs": 300000,
        "maxOutputBytes": 1048576,
        "inputSchema": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "vault",
            "batch",
            "authorization"
          ],
          "properties": {
            "vault": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "requestId": {
              "type": "string",
              "minLength": 8,
              "maxLength": 64
            },
            "batch": {
              "type": "string",
              "minLength": 1,
              "maxLength": 80
            },
            "authorization": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "origin",
                "request"
              ],
              "properties": {
                "origin": {
                  "type": "string",
                  "enum": [
                    "operator",
                    "clio",
                    "unattended"
                  ]
                },
                "request": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 2000
                }
              }
            },
            "dryRun": {
              "type": "boolean"
            },
            "planHash": {
              "type": "string",
              "minLength": 64,
              "maxLength": 64
            },
            "opId": {
              "type": "string",
              "minLength": 8,
              "maxLength": 64
            },
            "targetBatch": {
              "type": "string",
              "minLength": 1,
              "maxLength": 80
            }
          }
        }
      },
      {
        "name": "vitals",
        "description": "Read revision-checked structural vitals from the external snapshot without promoting notes or changing the vault.",
        "runtime": "node",
        "entrypoint": "tools/vitals.mjs",
        "timeoutMs": 60000,
        "maxOutputBytes": 1048576,
        "inputSchema": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "vault"
          ],
          "properties": {
            "vault": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "maturity": {
              "type": "string",
              "enum": [
                "raw",
                "adolescent",
                "mature",
                "synthesis-ready"
              ]
            },
            "connectivityTier": {
              "type": "string",
              "enum": [
                "isolated",
                "sparse",
                "connected",
                "hub"
              ]
            },
            "folder": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "sort": {
              "type": "string",
              "enum": [
                "health",
                "freshness",
                "words"
              ]
            },
            "limit": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            }
          }
        }
      },
      {
        "name": "candidates",
        "description": "Request related-note candidates at an exact raw source revision. Returns embedding_off until semantic candidates are available; this read does not create a receipt or change the vault.",
        "runtime": "node",
        "entrypoint": "tools/candidates.mjs",
        "timeoutMs": 30000,
        "maxOutputBytes": 1048576,
        "inputSchema": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "vault",
            "source",
            "revision"
          ],
          "properties": {
            "vault": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "source": {
              "type": "string",
              "minLength": 1,
              "maxLength": 4096
            },
            "revision": {
              "type": "string",
              "minLength": 64,
              "maxLength": 64
            },
            "limit": {
              "type": "integer",
              "minimum": 1,
              "maximum": 12
            }
          }
        }
      }
    ]
  },
  "runtime": {
    "api": 2,
    "entrypoint": "runtime/extension.ts",
    "commands": [
      {
        "name": "status",
        "description": "Show registered vaults and the last index snapshot."
      },
      {
        "name": "log",
        "description": "Show the last five operation log lines per vault."
      }
    ],
    "events": [
      "session_open",
      "session_close"
    ],
    "hooks": [
      {
        "on": "turn_start",
        "timeoutMs": 250,
        "onTimeout": "pass",
        "onError": "pass"
      },
      {
        "on": "after_tool",
        "tools": [
          "extension_notient__search",
          "extension_notient__note"
        ],
        "timeoutMs": 250,
        "onTimeout": "pass",
        "onError": "pass"
      }
    ],
    "ui": [
      "status",
      "panel"
    ],
    "permissions": {
      "fs": {
        "read": [
          "/home/akougkas/.local/state/notient",
          "/home/akougkas/projects/notient/clio/fixtures/toy-vault",
          "/mnt/c/Users/akougk/Projects/vaultex"
        ],
        "write": []
      },
      "exec": false,
      "net": false
    },
    "state": {
      "session": true,
      "store": true
    }
  }
}
