name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun install --cwd integrations/obsidian --frozen-lockfile

      - run: bun run typecheck

      - run: bun run typecheck:obsidian

      - run: bun run build:obsidian

      - run: bun run lint

      - run: bun run test

  integration:
    name: Integration
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install SurrealDB v3.0.5
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          # The upstream installer mis-parses a positional install directory under dash.
          curl -sSfL https://github.com/surrealdb/surrealdb/releases/download/v3.0.5/surreal-v3.0.5.linux-amd64.tgz \
            | tar -xz -C "$HOME/.local/bin" surreal
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify SurrealDB version
        run: surreal version

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run test:integration

  candidate:
    name: Installed release package
    needs: [unit, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install SurrealDB v3.0.5
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          # The upstream installer mis-parses a positional install directory under dash.
          curl -sSfL https://github.com/surrealdb/surrealdb/releases/download/v3.0.5/surreal-v3.0.5.linux-amd64.tgz \
            | tar -xz -C "$HOME/.local/bin" surreal
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify SurrealDB version
        run: surreal version
      - run: bun install --frozen-lockfile
      - run: bun install --cwd integrations/obsidian --frozen-lockfile
      - run: bun run release:prepare
      - name: Check the installed package
        shell: bash
        run: |
          set -euo pipefail
          packages=(artifacts/*/notient-*.tgz)
          test "${#packages[@]}" -eq 1
          bun run release:check "${packages[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: notient-package-${{ github.sha }}
          path: artifacts/*/*
          if-no-files-found: error
