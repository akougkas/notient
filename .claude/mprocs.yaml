# Notient Multi-Agent Orchestration v3 (Role-Based)
# Usage: mprocs -c .claude/mprocs.yaml
#
# Architecture:
#   User (CEO) → Orchestrator (Chief Engineer) → Role-Based Agents
#
# Roles:
#   CODERS: implementer, simplifier, validator, tester, architect, advisor
#   RESEARCHERS: docs-fetcher, codebase-navigator, world-knowledge
#
# Each role can be dispatched to any CLI: claude, gemini, cursor-agent, opencode
#
# Workflow:
#   1. Orchestrator proposes dispatch options to CEO
#   2. CEO approves, orchestrator runs: dispatch.py <role> "task" --cli <platform>
#   3. Role queue processor picks up task, runs CLI
#   4. Orchestrator checks: dispatch.py --responses <role>
#   5. Orchestrator reports results to CEO

server: 127.0.0.1:4050
log_dir: <CONFIG_DIR>/logs

procs:
  # ═══════════════════════════════════════════════════════════════════════════
  # FILE BROWSER & ORCHESTRATOR
  # ═══════════════════════════════════════════════════════════════════════════

  repos:
    cwd: /home/akougkas/projects/notient
    shell: "YAZI_CONFIG_HOME=/home/akougkas/projects/notient/.claude/yazi-config /home/akougkas/projects/notient/.claude/bin/yazi"
    autostart: true
    stop: "SIGTERM"

  orchestrator:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ORCHESTRATOR: "1"
    cmd:
      - claude
      - --dangerously-skip-permissions
      - --model
      - claude-opus-4-5-20251101
      - "Read @.claude/orchestration/orchestrator/CLAUDE.md and confirm ready."
    autostart: true
    stop: "SIGTERM"

  # ═══════════════════════════════════════════════════════════════════════════
  # CODER ROLES (Multi-CLI capable)
  # ═══════════════════════════════════════════════════════════════════════════

  implementer:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ROLE: "implementer"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run .claude/agents/queue-processor.py implementer"
    autostart: true
    stop: "SIGTERM"

  simplifier:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ROLE: "simplifier"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run .claude/agents/queue-processor.py simplifier"
    autostart: true
    stop: "SIGTERM"

  validator:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ROLE: "validator"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run .claude/agents/queue-processor.py validator"
    autostart: true
    stop: "SIGTERM"

  tester:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ROLE: "tester"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run .claude/agents/queue-processor.py tester"
    autostart: false
    stop: "SIGTERM"

  architect:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ROLE: "architect"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run .claude/agents/queue-processor.py architect"
    autostart: false
    stop: "SIGTERM"

  advisor:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ROLE: "advisor"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run .claude/agents/queue-processor.py advisor"
    autostart: false
    stop: "SIGTERM"

  # ═══════════════════════════════════════════════════════════════════════════
  # RESEARCHER ROLES (Multi-CLI capable)
  # ═══════════════════════════════════════════════════════════════════════════

  docs-fetcher:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ROLE: "docs-fetcher"
      NOTIENT_CATEGORY: "researcher"
    shell: "uv run .claude/agents/queue-processor.py docs-fetcher"
    autostart: true
    stop: "SIGTERM"

  codebase-navigator:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ROLE: "codebase-navigator"
      NOTIENT_CATEGORY: "researcher"
    shell: "uv run .claude/agents/queue-processor.py codebase-navigator"
    autostart: false
    stop: "SIGTERM"

  world-knowledge:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ROLE: "world-knowledge"
      NOTIENT_CATEGORY: "researcher"
    shell: "uv run .claude/agents/queue-processor.py world-knowledge"
    autostart: false
    stop: "SIGTERM"
