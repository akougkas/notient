# Notient Multi-Agent Orchestration v4 (Dynamic Two-Tier)
# Usage: mprocs -c .claude/mprocs.yaml
#
# Architecture:
#   User (CEO) → Orchestrator (Chief Engineer) → Base Army + Dynamic Spawns
#
# Two-Tier System:
#   Tier 1: Base Army (boot with orchestrator) - 4 edit agents on Claude
#   Tier 2: Dynamic Spawns (on demand) - researchers + extra coders
#
# Pane Naming: {role}-{model} or {role}-{model}-{N} for extras
#
# Lifecycle Management:
#   dispatch.py spawn <role> --cli <platform>   # Spawn dynamic agent
#   dispatch.py kill <instance>                 # Kill dynamic agent
#   dispatch.py refresh <instance>              # Kill + respawn (context exhaustion)
#   dispatch.py status                          # All agents with context %
#   dispatch.py list-instances                  # Show dynamic instances

server: 127.0.0.1:4050
log_dir: <CONFIG_DIR>/logs

procs:
  # ═══════════════════════════════════════════════════════════════════════════
  # ALWAYS RUNNING
  # ═══════════════════════════════════════════════════════════════════════════

  repos:
    cwd: /home/akougkas/projects/notient
    shell: "YAZI_CONFIG_HOME=/home/akougkas/projects/notient/.claude/yazi-config /home/akougkas/projects/notient/.claude/bin/yazi"
    autostart: true
    stop: "SIGTERM"

  orchestrator:
    cwd: /home/akougkas/projects/notient
    env:
      NOTIENT_ORCHESTRATOR: "1"
    cmd:
      - claude
      - --dangerously-skip-permissions
      - --model
      - claude-opus-4-5-20251101
      - "Read @.claude/orchestration/orchestrator/CLAUDE.md and confirm ready."
    autostart: true
    stop: "SIGTERM"

  # ═══════════════════════════════════════════════════════════════════════════
  # BASE ARMY - Edit Agents (permanent worktrees, always running)
  # ═══════════════════════════════════════════════════════════════════════════

  implementer-claude:
    cwd: /home/akougkas/projects/_worktrees/notient-implementer
    env:
      NOTIENT_ROLE: "implementer"
      NOTIENT_INSTANCE: "implementer-claude"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run /home/akougkas/projects/notient/.claude/agents/queue-processor.py implementer --instance implementer-claude"
    autostart: true
    stop: "SIGTERM"

  simplifier-claude:
    cwd: /home/akougkas/projects/_worktrees/notient-simplifier
    env:
      NOTIENT_ROLE: "simplifier"
      NOTIENT_INSTANCE: "simplifier-claude"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run /home/akougkas/projects/notient/.claude/agents/queue-processor.py simplifier --instance simplifier-claude"
    autostart: true
    stop: "SIGTERM"

  validator-claude:
    cwd: /home/akougkas/projects/_worktrees/notient-validator
    env:
      NOTIENT_ROLE: "validator"
      NOTIENT_INSTANCE: "validator-claude"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run /home/akougkas/projects/notient/.claude/agents/queue-processor.py validator --instance validator-claude"
    autostart: true
    stop: "SIGTERM"

  tester-claude:
    cwd: /home/akougkas/projects/_worktrees/notient-tester
    env:
      NOTIENT_ROLE: "tester"
      NOTIENT_INSTANCE: "tester-claude"
      NOTIENT_CATEGORY: "coder"
    shell: "uv run /home/akougkas/projects/notient/.claude/agents/queue-processor.py tester --instance tester-claude"
    autostart: true
    stop: "SIGTERM"

  # ═══════════════════════════════════════════════════════════════════════════
  # DYNAMIC AGENTS - Spawned via dispatch.py spawn
  # ═══════════════════════════════════════════════════════════════════════════
  # (None defined here - all dynamic via mprocs --ctl add-proc)
  #
  # Examples of dynamic spawns:
  #   uv run dispatch.py spawn implementer --cli gemini
  #     → Creates: implementer-gemini (with temp worktree)
  #
  #   uv run dispatch.py spawn implementer --cli claude
  #     → Creates: implementer-claude-2 (next available number)
  #
  #   uv run dispatch.py spawn docs-fetcher --cli gemini
  #     → Creates: docs-fetcher-gemini (read-only, no worktree)
  #
  # Dynamic agent categories:
  #   - Read-Only Agents: advisor, docs-fetcher, codebase-navigator, world-knowledge, architect
  #   - Extra Edit Agents: implementer-{model}-N, simplifier-{model}-N, etc.
